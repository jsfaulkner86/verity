[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verity"
version = "0.1.0"
description = "LLM confidence scoring layer — multi-dimensional epistemic verification for source grounding, factual consistency, and claim accuracy."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "John Faulkner", email = "john@thefaulknergroupadvisors.com" }
]
keywords = [
    "llm", "confidence-scoring", "hallucination-detection",
    "epistemic-verification", "hitl", "healthcare-ai",
    "fastapi", "langchain", "pydantic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]
langsmith = [
    "langsmith>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/jsfaulkner86/verity"
Repository = "https://github.com/jsfaulkner86/verity"
Issues = "https://github.com/jsfaulkner86/verity/issues"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=verity --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
